server.port=8080
spring.application.name=api-gateway
spring.config.import=optional:configserver:http://localhost:8888/
management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true

# EUREKA DISCOVERY
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# JWT SECURITY (Crucial for the Filter!)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS CONFIG (Allows frontend to talk to gateway)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*

# ROUTES (V1.2)
# 1. Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URL:lb://AUTH-SERVICE}
spring.cloud.gateway.routes[0].predicates[0]=Path=/gateway/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# 2. Application Service
spring.cloud.gateway.routes[1].id=application-service
spring.cloud.gateway.routes[1].uri=${APPLICATION_SERVICE_URL:lb://APPLICATION-SERVICE}
spring.cloud.gateway.routes[1].predicates[0]=Path=/gateway/applications/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[1].filters[1]=AuthenticationFilter

# 3. Document Service
spring.cloud.gateway.routes[2].id=document-service
spring.cloud.gateway.routes[2].uri=${DOCUMENT_SERVICE_URL:lb://DOCUMENT-SERVICE}
spring.cloud.gateway.routes[2].predicates[0]=Path=/gateway/documents/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[2].filters[1]=AuthenticationFilter

# 4. Admin Service
spring.cloud.gateway.routes[3].id=admin-service
spring.cloud.gateway.routes[3].uri=${ADMIN_SERVICE_URL:lb://ADMIN-SERVICE}
spring.cloud.gateway.routes[3].predicates[0]=Path=/gateway/admin/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[3].filters[1]=AuthenticationFilter

# SWAGGER AGGREGATION
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# List of all microservices to aggregate
springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/gateway/auth/v3/api-docs
springdoc.swagger-ui.urls[1].name=Application Service
springdoc.swagger-ui.urls[1].url=/gateway/applications/v3/api-docs
springdoc.swagger-ui.urls[2].name=Document Service
springdoc.swagger-ui.urls[2].url=/gateway/documents/v3/api-docs
springdoc.swagger-ui.urls[3].name=Admin Service
springdoc.swagger-ui.urls[3].url=/gateway/admin/v3/api-docs

