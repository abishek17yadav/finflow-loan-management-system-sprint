services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=authdb
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker-config/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - finflow-network

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - EUREKA_SERVICE_URL=http://localhost:8761/eureka/
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - finflow-network

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      - EUREKA_SERVICE_URL=${EUREKA_SERVICE_URL}
      - CONFIG_REPO_PATH=file:/app/config-repo
    volumes:
      - ./config-repo:/app/config-repo
    depends_on:
      eureka-server:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - finflow-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_SERVICE_URL=${EUREKA_SERVICE_URL}
      - EUREKA_INSTANCE_HOSTNAME=api-gateway
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888/
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - finflow-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_AUTH}
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - EUREKA_SERVICE_URL=${EUREKA_SERVICE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888/
      - DATABASE_HOST=mysql-db
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - finflow-network

  application-service:
    build:
      context: .
      dockerfile: application-service/Dockerfile
    container_name: application-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_APP}
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - EUREKA_SERVICE_URL=${EUREKA_SERVICE_URL}
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888/
      - DATABASE_HOST=mysql-db
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - finflow-network

  document-service:
    build:
      context: .
      dockerfile: document-service/Dockerfile
    container_name: document-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_DOC}
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - EUREKA_SERVICE_URL=${EUREKA_SERVICE_URL}
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888/
      - DATABASE_HOST=mysql-db
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - finflow-network

  admin-service:
    build:
      context: .
      dockerfile: admin-service/Dockerfile
    container_name: admin-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_ADMIN}
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - EUREKA_SERVICE_URL=${EUREKA_SERVICE_URL}
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888/
      - DATABASE_HOST=mysql-db
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - finflow-network

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - finflow-network

  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - finflow-network

  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    networks:
      - finflow-network
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs

networks:
  finflow-network:
    driver: bridge

volumes:
  mysql-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
